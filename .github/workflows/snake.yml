name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs (brand colours)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF4F87&color_dots=#EFEAFB,#D9CCFF,#B49CFF,#8B6CF0,#5B3FB8
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF4F87&color_dots=#241645,#3A2470,#5B3FB8,#8B6CF0,#C8B6FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
